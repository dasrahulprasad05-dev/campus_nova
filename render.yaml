services:
  - type: web
    name: campusnova-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn placepulse_ds_lab.api.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
